# EMA Scanner — default configuration
#
# Every value here traces to a specific notebook cell; see docs/NOTEBOOK_AUDIT.md.
# `category` on each block is one of:
#   SOURCE_DERIVED_RULE | MATHEMATICAL_DEFINITION | RESEARCH_HYPOTHESIS
#   | OPTIONAL_FILTER | PLACEHOLDER_UNVERIFIED | ENGINEERING_DECISION
# None of the numeric defaults below are asserted "optimal" — see STRATEGY_SPEC.md.

strategy:
  version: "ema_cluster_v1"      # STRATEGY_VERSION — bump only when math changes (Section 88)
  ema:
    fast: 10          # category: SOURCE_DERIVED_RULE (user's own spec)
    medium: 20         # category: SOURCE_DERIVED_RULE
    structural: 89     # category: SOURCE_DERIVED_RULE
    long: 200          # category: SOURCE_DERIVED_RULE
    seed_method: sma   # sma | first_obs — category: MATHEMATICAL_DEFINITION (notebook Cell 6/14)

  swing:
    left_bars: 5        # category: ENGINEERING_DECISION (default unchanged from notebook)
    right_bars: 5        # confirmation lag — the *existence* of the lag is SOURCE_DERIVED (no-lookahead)

  volatility:
    atr_period: 14        # category: SOURCE_DERIVED_RULE ("Preserve ATR14")
    ema_slope_lookback_days: 10  # category: ENGINEERING_DECISION -- Phase-3 BLOCKER 25 (was a bare k=10 default)

  cluster:
    width_lookback: 252              # category: RESEARCH_HYPOTHESIS
    compression_percentile: 0.20      # category: RESEARCH_HYPOTHESIS
    expansion_percentile: 0.80        # category: RESEARCH_HYPOTHESIS
    flat_band_percentile: 0.10        # category: RESEARCH_HYPOTHESIS (notebook Cell 20 default)
    width_slope_lookback_days: 5       # category: ENGINEERING_DECISION -- Phase-3 BLOCKER 25 (was a bare .rolling(5))
    percentile_min_periods: 30          # category: ENGINEERING_DECISION -- Phase-3 BLOCKER 25 (was a bare min_periods=30)

  definitions:
    sequential_crossover_max_gap_sessions: 10   # category: RESEARCH_HYPOTHESIS (Definition A)
    compression_expansion_lookahead_days: 10     # category: RESEARCH_HYPOTHESIS (Definition D)
    enabled: [A, B, C, D]

  pullback:
    shallow_atr: 1.0        # category: RESEARCH_HYPOTHESIS
    moderate_atr: 2.5        # category: RESEARCH_HYPOTHESIS
    deep_atr: 4.0             # category: RESEARCH_HYPOTHESIS
    breakout_memory_bars: 60   # category: ENGINEERING_DECISION — promoted from an unlabeled magic
                                # number in the notebook (Cell 26); default value unchanged

  entries:
    enabled: [A, B, C, D, E]   # category: RESEARCH_HYPOTHESIS x5, independently selectable

  regime:
    benchmark: NIFTY50           # NIFTY50 | NIFTY200 | CUSTOM — category: ENGINEERING_DECISION
                                   # (brief Section 33: keep configurable, don't change the notebook default silently)
    index_ema_fast: 20
    index_ema_medium: 50
    index_ema_structural: 89
    index_ema_long: 200

  relative_strength:
    windows: [20, 60, 120]      # category: SOURCE_DERIVED_RULE

  liquidity:
    enabled: false                       # category: OPTIONAL_FILTER — OFF by default (notebook Cell 6)
    min_price: 0.0
    min_average_daily_traded_value: 0.0
    min_average_volume: 0.0
    min_days_with_valid_volume: 0
    volume_window_fast_days: 20   # category: ENGINEERING_DECISION -- Phase-3 BLOCKER 25
    volume_window_slow_days: 50

data:
  min_history_years: 4          # category: ENGINEERING_DECISION
  max_stale_sessions: 5          # category: ENGINEERING_DECISION — now enforced in TRADING SESSIONS,
                                   # not calendar days, and no longer silently overridden (see audit §4)
  refresh_overlap_sessions: 10    # category: ENGINEERING_DECISION (Section 18 of brief)
  primary_provider: YFINANCE       # category: ENGINEERING_DECISION — the brief prefers NSE
                                     # (Section 14), but the NSE bhavcopy endpoint could not be
                                     # verified in this build environment (see DATA_SOURCES.md);
                                     # defaulting to the VERIFIED, IMPLEMENTED provider rather
                                     # than an unverified one. Switch to NSE once its endpoint is
                                     # confirmed and wired up in data/nse.py.
  secondary_provider: NSE
  price_mode: SPLIT_ADJUSTED       # RAW | SPLIT_ADJUSTED | TOTAL_RETURN_ADJUSTED — category: ENGINEERING_DECISION
                                     # (yfinance auto_adjust=False + explicit AdjClose column preserved,
                                     # see DATA_MODEL.md for what each mode actually means here)

calendar:
  exchange: NSE
  timezone: Asia/Kolkata
  provider: pandas_market_calendars  # XNSE calendar; see DATA_SOURCES.md for verification notes
  session_open: "09:15"
  session_close: "15:30"
  eod_data_cutoff: "16:00"    # category: ENGINEERING_DECISION -- distinct from session_close;
                                # a buffer after the exchange close before a scan trusts an
                                # external EOD data provider has published the final bar
                                # (see docs/RESEARCH_LIMITATIONS.md: this is NOT a precise
                                # model of NSE's closing-auction/post-close mechanics)

universe:
  index_name: NIFTY200
  source_csv_url: "https://archives.nseindia.com/content/indices/ind_nifty200list.csv"  # unchanged from notebook Cell 8
  min_expected_constituents: 150   # sanity-check threshold, unchanged from notebook

execution:
  model: next_open     # same_close | next_open | next_close — category: ENGINEERING_DECISION (notebook default)

risk:
  risk_per_trade_pct: 0.5     # category: OPTIONAL / user-set
  atr_stop_multiple: 2.5       # category: OPTIONAL — kept separate from the swing-based stop

costs:
  # category: PLACEHOLDER_UNVERIFIED — copied unchanged from the notebook. The brief (Section 45)
  # explicitly forbids treating these as verified current broker/tax figures. Confirm against your
  # actual broker + current STT/GST/SEBI rates before trusting net-of-cost numbers.
  #
  # Side-aware (Phase-2 Section 17): Indian delivery-equity STT has historically applied
  # differently on buy vs sell legs depending on segment/product; this refactor does NOT assert
  # current rates (unverified), but the cost engine now supports asymmetric buy/sell legs rather
  # than forcing one flat round-trip percentage. A full BrokerProfile/ProductType hierarchy
  # (delivery vs intraday, broker-specific slabs) is explicitly NOT_IMPLEMENTED — out of scope for
  # this pass, to avoid overengineering a model with no verified inputs yet.
  brokerage_pct: 0.03
  stt_pct: 0.10
  stt_buy_pct: 0.10           # override; defaults to stt_pct if left equal
  stt_sell_pct: 0.10           # override; defaults to stt_pct if left equal
  exchange_charges_pct: 0.00345
  gst_pct: 0.18
  stamp_duty_pct: 0.0          # not modeled in the notebook; left at 0 rather than invented
  stamp_duty_buy_only: true     # stamp duty is conventionally buy-side only in India; NOT independently verified
  sebi_charges_pct: 0.0         # not modeled in the notebook; left at 0 rather than invented
  slippage_pct: 0.05

research:
  horizons_days: [1, 3, 5, 10, 20, 40]   # category: SOURCE_DERIVED (notebook FORWARD_HORIZONS)
  walk_forward:
    train_years: 3.0
    test_years: 1.0
    step_years: 1.0
  backtest:
    # category: ENGINEERING_DECISION -- Phase-2 Section 14: previously hidden
    # function defaults, now centralized here so nothing is a magic number
    # inside research/backtest.py.
    initial_capital: 1000000.0
    max_concurrent_positions: 20
    max_position_pct_of_equity: 100.0
    fixed_horizon_days: 20
    minimum_trade_qty: 1
    exit_rule: STOP_ONLY_RESEARCH
    entry_model_col: Any_Entry_Triggered
    cost_scenario: base_cost
    risk_budget_basis: EQUITY   # category: ENGINEERING_DECISION -- matches STRATEGY_SPEC.md
                                  # Section 8's documented "equity * risk_per_trade_pct" formula.
                                  # CASH is available as an explicit, selectable research variant.

random_seed: 42
